apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp-app-deployment
  namespace: tp-app
  labels:
    app: tp-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tp-app
  template:
    metadata:
      labels:
        app: tp-app
    spec:
      containers:
        - name: tp-app-container
          image: europe-west1-docker.pkg.dev/lorens060104/tp-app-repo/tp-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config   # ConfigMap contenant APP_MESSAGE, UPLOAD_ALLOWED_EXT
            - secretRef:
                name: app-secret   # Secret contenant UPLOAD_PASSWORD
          volumeMounts:
            - name: shared-storage
              mountPath: /data
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tp-app-service
  namespace: tp-app
spec:
  type: LoadBalancer
  selector:
    app: tp-app
  ports:
    - protocol: TCP
      port: 80        # port externe
      targetPort: 5000  # port du container
